# BetterWarden configuration (Velocity proxy).

warden:
  config-version: 1

  server-name: "My Network"

  # host | client. host embeds its own core (default - Stage 3). client connects to an
  # external core instead (e.g. a warden-standalone Docker deployment, Stage 4) and never
  # boots a local database - set warden.core.url below when using client.
  mode: host

  # Only read when mode: client. Must match a node-token the target core also has (same
  # value as warden.security.node-token below, copied into that core's own config.yml).
  core:
    url: "http://localhost:8095"

  storage:
    # sqlite | mysql - only relevant in host mode.
    type: sqlite
    mysql:
      host: localhost
      port: 3306
      database: warden
      username: warden
      password: ""

  panel:
    port: 8095
    # Set to "127.0.0.1" once a reverse proxy on this same machine is the
    # only intended way in. Leave blank to bind all interfaces.
    bind-address: ""
    # Only turn this on if a reverse proxy or tunnel (nginx/Caddy/Cloudflare
    # Tunnel) is the sole way in - see docs/deployment. If this panel is ever
    # reachable directly, leave it false: X-Forwarded-* headers are otherwise
    # spoofable by any client.
    trust-forwarded-headers: false

  login-gate:
    fail-open: true

  alt-detection:
    ban-evasion-auto-action: false

  maintenance:
    report-auto-close-hours: 72
    ticket-auto-close-hours: 168

  node:
    # host mode only: host backend servers should use to reach this proxy's
    # embedded core over HTTP (Stage 3 handshake). Change this if backends
    # run on a different machine than the proxy.
    advertise-host: localhost

  discord:
    enabled: false
    # Your own bot token from discord.com/developers - never a shared one. Leave blank/enabled:
    # false to skip connecting entirely (the bot is optional, everything else works without it).
    token: ""
    guild-id: ""
    # Discord role IDs allowed to use moderation slash commands - empty means nobody can, not everyone.
    staff-role-ids: []
    feeds:
      # Channel IDs - blank means that feed is off.
      punishment-log: ""
      digest: ""

  branding:
    # Shown in the panel header and login/landing pages. Blank = no logo image, just the
    # server name text. Must be a URL the panel's own browser can reach (an image host,
    # your own site, etc.) - not a local file path.
    logo-url: ""
    # Hex colour, e.g. "#5b8cff" - blank keeps the panel's own default accent.
    accent-color: ""
