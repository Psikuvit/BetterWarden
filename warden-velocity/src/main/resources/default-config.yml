# BetterWarden configuration (Velocity proxy, HOST mode).

warden:
  config-version: 1

  server-name: "My Network"

  storage:
    # sqlite | mysql (mysql not wired up yet)
    type: sqlite
    mysql:
      host: localhost
      port: 3306
      database: warden
      username: warden
      password: ""

  panel:
    port: 8095

  login-gate:
    fail-open: true

  alt-detection:
    ban-evasion-auto-action: false

  maintenance:
    report-auto-close-hours: 72
    ticket-auto-close-hours: 168

  node:
    # Host backend servers should use to reach this proxy's embedded core
    # over HTTP (Stage 3 handshake). Change this if backends run on a
    # different machine than the proxy.
    advertise-host: localhost
