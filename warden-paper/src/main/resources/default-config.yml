# BetterWarden configuration.

warden:
  config-version: 1

  server-name: "My Server"

  # host | client. client skips booting this server's own core - only meaningful
  # behind a Stage 3 proxy, and CLIENT mode's networking isn't implemented yet,
  # so setting this to client currently just disables punishment enforcement here.
  mode: host

  storage:
    # sqlite | mysql (mysql not wired up yet)
    type: sqlite
    mysql:
      host: localhost
      port: 3306
      database: warden
      username: warden
      password: ""

  panel:
    port: 8095
    # Set to "127.0.0.1" once a reverse proxy on this same machine is the
    # only intended way in. Leave blank to bind all interfaces.
    bind-address: ""
    # Only turn this on if a reverse proxy or tunnel (nginx/Caddy/Cloudflare
    # Tunnel) is the sole way in - see docs/deployment. If this panel is ever
    # reachable directly, leave it false: X-Forwarded-* headers are otherwise
    # spoofable by any client.
    trust-forwarded-headers: false

  login-gate:
    fail-open: true

  alt-detection:
    ban-evasion-auto-action: false

  maintenance:
    report-auto-close-hours: 72
    ticket-auto-close-hours: 168

  chat-filter:
    enabled: true
    # Plain words are matched against a normalized form (lowercased, spacing/leetspeak/homoglyphs
    # collapsed), so "f u c k" and "fuck" both hit a "fuck" entry. Prefix an entry with "regex:" to
    # match a real regex against the raw message instead (e.g. "regex:\bfree\s*nitro\b") - regex
    # rules skip normalization entirely, since normalizing would strip the pattern syntax itself.
    # Empty by default - add your own, no built-in wordlist is shipped.
    blocked-words: []
    ad-detection: true
    caps-threshold-percent: 70
    caps-min-length: 10
    spam-message-limit: 5
    spam-window-seconds: 8
    repeat-message-limit: 3
    # Flagged/blocked hits within the window before an automatic mute.
    auto-punish-threshold: 5
    auto-punish-window-minutes: 10
    auto-punish-duration-minutes: 30

  discord:
    enabled: false
    # Your own bot token from discord.com/developers - never a shared one. Leave blank/enabled:
    # false to skip connecting entirely (the bot is optional, everything else works without it).
    token: ""
    guild-id: ""
    # Discord role IDs allowed to use moderation slash commands - empty means nobody can, not everyone.
    staff-role-ids: []
    feeds:
      # Channel IDs - blank means that feed is off.
      punishment-log: ""
      digest: ""
