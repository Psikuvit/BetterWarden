# BetterWarden configuration (standalone core - Docker/Network tier).

warden:
  config-version: 1

  server-name: "My Network"

  storage:
    # mysql is the real default here - this deployment shape exists specifically for a shared,
    # multi-node network, and SQLite is not safe for concurrent writers across processes.
    type: mysql
    mysql:
      host: mysql
      port: 3306
      database: warden
      username: warden
      password: "changeme"

  panel:
    port: 8095
    bind-address: ""
    # Same rule as everywhere else: false until you've actually put a reverse proxy/tunnel in
    # front (see docs/deployment) - docker-compose.yml here does NOT include one for you.
    trust-forwarded-headers: false

  login-gate:
    fail-open: true

  alt-detection:
    ban-evasion-auto-action: false

  maintenance:
    report-auto-close-hours: 72
    ticket-auto-close-hours: 168
