# Fallback defaults; ConfigBootstrap overrides these at runtime from config.yml.
server.port=8095
spring.main.banner-mode=off
spring.jpa.hibernate.ddl-auto=none
logging.level.root=INFO

# Panel session cookie (spec 04-PANEL.txt §6: Secure + HttpOnly + SameSite). http-only/secure
# are already Spring Boot's own defaults - spelled out here so the choice is explicit, not just
# whatever the framework happens to default to.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
